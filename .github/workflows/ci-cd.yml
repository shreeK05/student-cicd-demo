name: Student Result CI-CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  test:
    name: CI - Test Student Result
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install pytest

      - name: Run Automated Tests
        run: |
          pytest

  deploy:
    name: CD - Deploy Student Result Application
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Student Result Application deployed successfully!"